; GTA Launcher runtime configuration.
; All relative paths are resolved from the directory containing Launcher.exe.

[Launcher]
; Directory that directly contains GTAVLauncher.exe.
; If this option remains commented, GTA_5_INSTALL_DIR is used instead.
;GameInstallDirectory=

[Python]
; Directory containing user Python scripts. It may be absolute or relative to this file.
; GTA_5_PYTHON_SCRIPT_DIR overrides this setting when it is defined and non-empty.
; The built-in default is scripts.
;ScriptsDirectory=scripts

; Semicolon-separated .py files to start automatically after the Python runtime is initialized.
; Each file must be a direct child of ScriptsDirectory, for example: agent_server.py;telemetry.py
AutoStartScripts=agent_server.py

; Directory containing additional Python packages for embedded scripts.
; If this option remains commented, the runtime virtual environment is used.
;SitePackagesDirectory=.venv\Lib\site-packages

[GUI]
; UI scale override. Set to 0 for automatic DPI and resolution scaling (2x is used on a 4K display).
;Scale=0
; Initial window width in logical pixels before UI scaling.
;WindowWidth=620
; Initial window height in logical pixels before UI scaling.
;WindowHeight=420
