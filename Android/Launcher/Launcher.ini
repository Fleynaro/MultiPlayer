; GTA Launcher runtime configuration.
; All relative paths are resolved from the directory containing Launcher.exe.

[Launcher]
; Directory that directly contains GTAVLauncher.exe.
; If this option remains commented, GTA_5_INSTALL_DIR is used instead.
;GameInstallDirectory=

[Python]
; Directory containing user Python scripts. It may be absolute or relative to this file.
ScriptsDirectory=scripts

; Directory containing additional Python packages for embedded scripts.
; If this option remains commented, the runtime virtual environment is used.
;SitePackagesDirectory=.venv\Lib\site-packages
